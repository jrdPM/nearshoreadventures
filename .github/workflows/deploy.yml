name: Publish to Cloudways

# Builds the site and uploads it to Cloudways.
# Runs when anything lands on main (including form submissions and admin
# decisions, which the PHP scripts save to the repo), once a day so "this
# weekend" stays current, and after every event round-up.
on:
  push:
    branches: [main]
    paths-ignore:
      - "newsletter/**"
      - "**.md"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Take in new submissions and review decisions
        run: |
          npm run intake
          git config user.name "nearshore-bot"
          git config user.email "nearshore-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Take in submissions and review decisions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build the site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://nearshoreadventures.com' }}

      - name: Add server settings for the PHP scripts
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SITE_GITHUB_TOKEN: ${{ secrets.SITE_GITHUB_TOKEN }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
        run: node scripts/write-php-config.mjs out/api/_config.php

      - name: Upload to Cloudways
        env:
          HOST: ${{ secrets.CLOUDWAYS_HOST }}
          USER: ${{ secrets.CLOUDWAYS_USER }}
          PASSWORD: ${{ secrets.CLOUDWAYS_PASSWORD }}
          SSH_KEY: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          APP: ${{ secrets.CLOUDWAYS_APP }}
          SITE_URL: ${{ vars.SITE_URL || 'https://phpstack-1346101-6733514.cloudwaysapps.com' }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$APP" ]; then
            echo "::warning::Cloudways secrets aren't set yet, so the site was built but not uploaded."
            exit 0
          fi
          APP="$(printf '%s' "$APP" | tr -d '[:space:]')"
          # CLOUDWAYS_APP can be the app's folder name or a full path to its public_html.
          case "$APP" in
            /*) TARGET="$APP" ;;
            *)  TARGET="applications/$APP/public_html" ;;
          esac
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/cloudways && chmod 600 ~/.ssh/cloudways
            RSH="ssh -i $HOME/.ssh/cloudways"
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            export SSHPASS="$PASSWORD"
            RSH="sshpass -e ssh -o PubkeyAuthentication=no"
          fi
          # Make sure the app folder exists before uploading.
          if ! $RSH "$USER@$HOST" "test -d '$TARGET'"; then
            echo "::error::The folder for CLOUDWAYS_APP wasn't found on the server. Use the app's folder name from Cloudways > Application > Access Details (a short random word). Folders on this server:"
            $RSH "$USER@$HOST" "ls -1 ~/applications 2>/dev/null || ls -1 /home/master/applications" || true
            exit 1
          fi
          rsync -rlz --delete --chmod=D755,F644 -e "$RSH" out/ "$USER@$HOST:$TARGET/"
          echo "Published to $HOST:$TARGET"
          echo "Files now in the app folder:"
          $RSH "$USER@$HOST" "ls -1 '$TARGET' | head -20"
          if [ -n "$SITE_URL" ]; then
            SITE_HOST="${SITE_URL#*://}"; SITE_HOST="${SITE_HOST%%/*}"
            echo "App folders whose settings mention $SITE_HOST:"
            $RSH "$USER@$HOST" "grep -rls '$SITE_HOST' applications/*/conf 2>/dev/null | cut -d/ -f2 | sort -u" || true
            echo "What $SITE_URL serves right now:"
            curl -sSL -m 20 -D - -o page.html "$SITE_URL/?v=$GITHUB_RUN_ID" | grep -iE "^(HTTP|server|x-cache|via|age|location)" || true; grep -o "<title>[^<]*</title>" page.html | head -1 || true
            echo "Admin page and queue checks (expect 200, then 401 when not signed in):"
            curl -sSL -m 20 -o admin.html -w "  /admin  HTTP %{http_code}\n" "$SITE_URL/admin" || true
            grep -o "<title>[^<]*</title>" admin.html | head -1 || true
            curl -sS -m 20 -w "  HTTP %{http_code}\n" "$SITE_URL/api/admin-queue.php" || true
            echo "Admin login check (wrong password on purpose; expect HTTP 401):"
            curl -sS -m 20 -o login.json -w "  HTTP %{http_code}\n" -X POST -H "content-type: application/json" -d '{"password":"not-the-password"}' "$SITE_URL/api/admin-login.php" || true
            head -c 300 login.json || true; echo
          fi
